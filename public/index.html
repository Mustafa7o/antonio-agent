<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antonio Agent V3</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090b10;color:#f3f4f6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#090b10,#111827);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:800}.muted{color:#9ca3af;font-size:13px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.card{background:#11151d;border:1px solid #242a36;border-radius:18px;padding:16px;box-shadow:0 10px 35px #0004}.chat{height:66vh;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:8px}.msg{padding:12px 14px;border-radius:14px;margin:8px 0;max-width:85%;white-space:pre-wrap}.user{background:#1d4ed8;margin-right:auto}.assistant{background:#1f2937;margin-left:auto}.composer{display:flex;gap:8px;margin-top:12px}.composer textarea{flex:1;background:#0b0e14;color:white;border:1px solid #303746;border-radius:12px;padding:12px;resize:none}.btn{border:0;border-radius:11px;padding:10px 14px;background:#2563eb;color:#fff;cursor:pointer}.btn.alt{background:#27303d}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;background:#0d1118;border-radius:14px}.num{font-size:23px;font-weight:800}.list{max-height:25vh;overflow:auto}.row{padding:10px;border-bottom:1px solid #252b36}.pill{font-size:11px;padding:3px 7px;border-radius:99px;background:#27303d}.login{position:fixed;inset:0;background:#080a0fcc;display:none;place-items:center;padding:20px}.login .box{width:min(420px,100%);background:#11151d;border:1px solid #2a3140;border-radius:18px;padding:20px}.login input{width:100%;margin:7px 0;padding:12px;background:#0b0e14;color:#fff;border:1px solid #303746;border-radius:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chat{height:58vh}}
</style></head>
<body><div class="wrap"><div class="top"><div><div class="brand">Antonio Agent <span class="pill">V4.1</span></div><div class="muted" id="status">جاري التحقق...</div></div><div><button class="btn alt" id="loginBtn">تسجيل الدخول</button><button class="btn alt" id="logoutBtn" style="display:none">خروج</button></div></div>
<div class="grid"><section class="card chat"><div id="msgs" class="msgs"></div><div class="composer"><textarea id="input" rows="2" placeholder="اكتب لـ Antonio أي مهمة..."></textarea><button class="btn" id="send">إرسال</button></div></section>
<aside class="card"><h3>الحالة</h3><div class="stats"><div class="stat"><div class="muted">المهام</div><div class="num" id="tasks">0</div></div><div class="stat"><div class="muted">قيد الانتظار</div><div class="num" id="pending">0</div></div><div class="stat"><div class="muted">الذاكرة</div><div class="num" id="mem">0</div></div><div class="stat"><div class="muted">الموافقات</div><div class="num" id="approvals">0</div></div></div><h3>المهام</h3><div id="taskList" class="list"></div><h3>الموافقات</h3><div id="approvalList" class="list"></div></aside></div></div>
<div class="login" id="login"><div class="box"><h2>تسجيل الدخول إلى Antonio</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn" id="doLogin" style="width:100%">دخول</button><button class="btn alt" id="doSignup" style="width:100%;margin-top:8px">إنشاء حساب</button><p class="muted" id="loginMsg"></p></div></div>
<script>
let cid=localStorage.getItem('antonio_cid');const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'request failed');return d}
function add(role,text){const x=document.createElement('div');x.className='msg '+role;x.textContent=text;$('msgs').appendChild(x);$('msgs').scrollTop=$('msgs').scrollHeight}
async function refresh(){try{const s=await api('/api/stats');$('tasks').textContent=s.tasks;$('pending').textContent=s.pending_approvals;$('mem').textContent=s.memories;$('approvals').textContent=s.pending_approvals;const ts=await api('/api/tasks');$('taskList').innerHTML=ts.slice(0,12).map(t=>`<div class=row><b>${esc(t.title)}</b><br><span class=pill>${esc(t.status)}</span></div>`).join('');const as=await api('/api/approvals');$('approvalList').innerHTML=as.filter(a=>a.status==='pending').slice(0,8).map(a=>`<div class=row><b>${esc(a.action)}</b><br><button class="btn" onclick="decide('${a.id}',true)">موافقة</button> <button class="btn alt" onclick="decide('${a.id}',false)">رفض</button></div>`).join('')}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function send(){const v=$('input').value.trim();if(!v)return;add('user',v);$('input').value='';$('send').disabled=true;try{const d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:v,conversation_id:cid})});cid=d.conversation_id;localStorage.setItem('antonio_cid',cid);add('assistant',d.answer);await refresh()}catch(e){add('assistant','خطأ: '+e.message)}finally{$('send').disabled=false}}
async function load(){if(cid){try{const m=await api('/api/conversations/'+cid+'/messages');$('msgs').innerHTML='';m.forEach(x=>add(x.role==='user'?'user':'assistant',x.content))}catch{cid=null;localStorage.removeItem('antonio_cid')}}const h=await api('/api/health');$('status').textContent=`${h.openai?'العقل متصل':'بانتظار مفتاح OpenAI'} · ${h.auth?'المصادقة مفعلة':'الوضع المحلي'} · ${h.cloud_db?'Postgres سحابي':'SQLite محلي'}`;if(h.auth){$('loginBtn').style.display='inline-block'}else $('loginBtn').style.display='none';await refresh()}
async function decide(id,approved){await api('/api/approvals/'+id+'/decide',{method:'POST',body:JSON.stringify({approved})});refresh()}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('loginBtn').onclick=()=>$('login').style.display='grid';$('doLogin').onclick=async()=>{try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('login').style.display='none';location.reload()}catch(e){$('loginMsg').textContent=e.message}};$('doSignup').onclick=async()=>{try{await api('/api/auth/signup',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('loginMsg').textContent='تم إنشاء الحساب. تحقق من البريد إذا كان التحقق مفعلاً.'}catch(e){$('loginMsg').textContent=e.message}};$('logoutBtn').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};load();setInterval(refresh,10000);
</script></body></html>
