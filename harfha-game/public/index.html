<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>حرفها</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25366b,#090d1a 65%);color:#fff;font-family:system-ui,"Noto Sans Arabic",sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:16px}.box{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:24px;padding:20px;box-shadow:0 20px 70px #0006}h1{text-align:center;font-size:40px;margin:5px}.sub{text-align:center;color:#b8c2dc;margin:5px 0 22px}.screen{display:none}.active{display:block}input,button{width:100%;padding:15px;border:0;border-radius:15px;font-size:18px;margin:6px 0}input{background:#fff;color:#111}.btn{background:#6f7cff;color:white;font-weight:800}.alt{background:#ffffff14;color:white}.row{display:flex;gap:8px}.row>*{flex:1}.code{text-align:center;font-size:32px;font-weight:900;letter-spacing:6px;background:#0004;padding:14px;border-radius:16px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{padding:12px;background:#ffffff0c;border-radius:14px}.you{outline:2px solid #6f7cff}.target{text-align:center;color:#b9c4df}.word{text-align:center;font-size:32px;font-weight:900;letter-spacing:8px;margin:4px 0 12px}.timer{text-align:center;font-size:27px;font-weight:900}.status{text-align:center;background:#ffffff0d;border-radius:14px;padding:12px;margin:10px 0}.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.letter{width:68px;height:82px;border-radius:17px;background:linear-gradient(145deg,#fff,#dbe2ff);color:#11182c;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;box-shadow:0 8px 20px #0005}.selected{outline:4px solid #6f7cff;transform:translateY(-6px)}.tiny{text-align:center;color:#aeb8d0;font-size:13px}.error{display:none;background:#ff4b4b22;color:#ffc0c0;padding:10px;border-radius:12px}</style></head><body><main class="app"><div class="box">
<section id="home" class="screen active"><h1>حرفها</h1><div class="sub">خذ حرفًا، مرّر حرفًا، كوّن كلمتك قبل الجميع.</div><input id="name" maxlength="20" placeholder="اسمك"><button class="btn" onclick="create()">إنشاء غرفة</button><div class="row"><input id="join" placeholder="رمز الغرفة"><button class="btn" onclick="join()">انضمام</button></div><div id="e1" class="error"></div><p class="tiny">2 أو 4 أو 6 لاعبين</p></section>
<section id="lobby" class="screen"><h1>الغرفة</h1><div id="code" class="code"></div><p class="tiny">شارك الرمز مع اللاعبين</p><div id="lp" class="players"></div><button id="start" class="btn" onclick="start()">ابدأ اللعبة</button><button class="alt" onclick="navigator.clipboard&&navigator.clipboard.writeText(room)">نسخ الرمز</button><div id="e2" class="error"></div></section>
<section id="game" class="screen"><div class="target">كلمتك السرية</div><div id="target" class="word"></div><div id="timer" class="timer">45</div><div id="status" class="status"></div><div id="cards" class="cards"></div><button id="pass" class="btn" onclick="pass()" disabled>اختر حرفًا لتمريره</button><h3>اللاعبون</h3><div id="gp" class="players"></div><p class="tiny">يصل إليك حرف من اللاعب السابق، ثم تمرّر حرفًا واحدًا من يدك للاعب التالي.</p></section>
<section id="finish" class="screen"><h1>انتهت الجولة</h1><div id="winner" class="status"></div><button class="btn" onclick="location.reload()">لعبة جديدة</button></section>
</div></main><script>
let room="",pid="",s=null,sel=null,timer=null;
const q=x=>document.getElementById(x),show=x=>{document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));q(x).classList.add("active")};
function er(m,id){q(id).textContent=m;q(id).style.display="block";setTimeout(()=>q(id).style.display="none",3000)}
async function post(u,b){let r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||"خطأ");return j}
async function create(){try{let j=await post("/api/create",{name:q("name").value||"لاعب"});room=j.room;pid=j.player;localStorage.hf=JSON.stringify({room,pid});show("lobby");loop()}catch(e){er(e.message,"e1")}}
async function join(){try{let j=await post("/api/join",{room:q("join").value,name:q("name").value||"لاعب"});room=j.room;pid=j.player;localStorage.hf=JSON.stringify({room,pid});show("lobby");loop()}catch(e){er(e.message,"e1")}}
async function start(){try{await post("/api/start",{room:room,player:pid})}catch(e){er(e.message,"e2")}}
function esc(x){return String(x).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&#92;","\"":"&#92;",""":"&quot;","'":"&#39;"}[m]})}
function render(x){s=x;q("code").textContent=x.room;if(x.phase==="lobby"){show("lobby");q("start").style.display=x.players[0].id===pid?"block":"none";q("lp").innerHTML=x.players.map(p=>'<div class="player '+(p.id===pid?"you":"")+'">👤 '+esc(p.name)+'<br><span class="tiny">جاهز</span></div>').join("");return}
if(x.phase==="finished"){show("finish");let w=x.players.find(p=>p.id===x.winner);q("winner").textContent=w?"الفائز: "+w.name:"انتهت الجولة";return}
show("game");q("target").textContent=x.me.target;let full=x.me.pending?x.me.hand.concat([x.me.pending]):x.me.hand;q("cards").innerHTML=full.map((c,i)=>'<div class="letter '+(sel===i?"selected":"")+'" onclick="pick('+i+')">'+esc(c)+'</div>').join("");let my=x.players[x.turn].id===pid;q("status").textContent=my?"دورك — استلمت حرفًا، اختر حرفًا لتمريره.":"دور "+x.players[x.turn].name;q("pass").disabled=!my||sel===null;q("gp").innerHTML=x.players.map(p=>'<div class="player '+(p.id===pid?"you":"")+'">👤 '+esc(p.name)+'<br><span class="tiny">'+p.handCount+' حروف</span></div>').join("")}
function pick(i){if(!s||s.players[s.turn].id!==pid)return;let len=s.me.hand.length;if(s.me.pending&&i===len){er("الحرف المستلم لا يمكن تمريره مباشرة. اختر حرفًا من يدك.","e2");return}sel=i;render(s)}
async function pass(){if(sel===null)return;try{await post("/api/pass",{room:room,player:pid,index:sel});sel=null}catch(e){er(e.message,"e2")}}
async function loop(){clearInterval(timer);timer=setInterval(async()=>{try{let r=await fetch("/api/state?room="+encodeURIComponent(room)+"&player="+encodeURIComponent(pid));if(r.ok)render(await r.json())}catch(e){}},700)}
setInterval(()=>{if(s&&s.ends){q("timer").textContent=Math.max(0,Math.ceil((s.ends-Date.now())/1000))}},250);
try{let x=JSON.parse(localStorage.hf);if(x&&x.room&&x.pid){room=x.room;pid=x.pid;show("lobby");loop()}}catch(e){}
</script></body></html>
