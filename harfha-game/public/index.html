<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>حرفها</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#344b91 0,#111936 35%,#070b16 78%);color:#f7f9ff;font-family:system-ui,"Noto Sans Arabic",Tahoma,sans-serif}.app{max-width:760px;margin:auto;padding:14px}.box{background:#10172bd9;border:1px solid #ffffff16;border-radius:28px;padding:18px;box-shadow:0 24px 90px #0008;backdrop-filter:blur(12px)}.screen{display:none}.active{display:block}.brand{text-align:center;font-size:44px;font-weight:1000;letter-spacing:-2px;margin:4px 0;background:linear-gradient(90deg,#fff,#9fb2ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{text-align:center;color:#aeb9d6;line-height:1.7;margin:0 0 22px}h2{margin:4px 0 16px;font-size:25px}.panel{background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;padding:14px;margin:10px 0}.input{width:100%;padding:15px 16px;border:1px solid #ffffff18;border-radius:15px;background:#fff;color:#101522;font-size:17px;outline:0;margin:5px 0}.input:focus{box-shadow:0 0 0 3px #7789ff44;border-color:#8797ff}.btn,.alt{width:100%;padding:14px 16px;border:0;border-radius:15px;font-size:17px;font-weight:850;margin:5px 0;cursor:pointer}.btn{background:linear-gradient(135deg,#7889ff,#5968e9);color:#fff;box-shadow:0 10px 24px #5365ed33}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.alt{background:#ffffff0d;color:#e9edff;border:1px solid #ffffff12}.row{display:flex;gap:8px}.row>*{flex:1}.code{font-size:34px;font-weight:1000;letter-spacing:8px;text-align:center;padding:16px;border-radius:18px;background:#080d1c;border:1px solid #ffffff12}.tiny{font-size:13px;color:#8f9bbb;text-align:center}.error{display:none;background:#ff5b6b18;border:1px solid #ff687533;color:#ffc8ce;padding:11px;border-radius:13px;margin-top:8px;text-align:center}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{background:#ffffff08;border:1px solid #ffffff0d;border-radius:16px;padding:12px;min-height:64px}.you{border-color:#7889ff66;background:#7889ff10}.player strong{display:block;font-size:16px}.badge{display:inline-block;font-size:11px;color:#aebaff;background:#7889ff1a;border:1px solid #7889ff2b;border-radius:20px;padding:3px 7px;margin-top:5px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.round{font-size:13px;color:#9ca9c8;background:#ffffff08;padding:7px 10px;border-radius:12px}.timer{font-size:28px;font-weight:1000;text-align:center;margin:5px}.timer.hot{color:#ff9ca8}.target{text-align:center;color:#95a4c8;font-size:13px}.word{text-align:center;font-size:35px;font-weight:1000;letter-spacing:7px;margin:2px 0 10px;min-height:48px}.status{text-align:center;padding:12px;border-radius:15px;background:#ffffff09;border:1px solid #ffffff0e;margin:10px 0;line-height:1.6}.status.myturn{background:#6f80ff15;border-color:#7889ff44;color:#e9ecff}.hand-title{text-align:center;color:#9ba8c6;font-size:13px;margin:14px 0 7px}.cards{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:88px}.letter{width:65px;height:78px;border-radius:17px;background:linear-gradient(145deg,#ffffff,#dce4ff);color:#11182d;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:1000;direction:rtl;unicode-bidi:isolate;box-shadow:0 9px 22px #0006;border:2px solid transparent;transition:.16s transform,.16s border-color,.16s box-shadow}.letter:not(.locked):active{transform:scale(.96)}.letter.selected{transform:translateY(-7px);border-color:#7385ff;box-shadow:0 14px 28px #5869e555,0 0 0 3px #7385ff33}.letter.pending{background:linear-gradient(145deg,#ffeaa7,#f5c75c);border-color:#e8b94e;color:#3a2b08}.locked{opacity:.82}.legend{text-align:center;font-size:12px;color:#9aa7c5;margin-top:7px}.divider{height:1px;background:#ffffff0d;margin:14px 0}.finish-icon{text-align:center;font-size:52px;margin:3px}.winner{font-size:24px;font-weight:1000;text-align:center}.score{font-size:13px;color:#a9b4d0}.empty{color:#8995b4;text-align:center;padding:15px}@media(max-width:480px){.app{padding:9px}.box{padding:14px;border-radius:22px}.players{grid-template-columns:1fr 1fr}.letter{width:61px;height:74px;font-size:35px}.word{font-size:31px}}
</style></head><body><main class="app"><div class="box">
<section id="home" class="screen active"><div class="brand">حرفها</div><div class="sub">استلم حرفك، بدّل حرفًا، وركّب كلمتك قبل الجميع.</div><div class="panel"><input id="name" class="input" maxlength="20" placeholder="اكتب اسمك"><button class="btn" onclick="create()">إنشاء غرفة</button><div class="row"><input id="join" class="input" maxlength="6" placeholder="رمز الغرفة"><button class="btn" onclick="join()">انضمام</button></div><div id="e1" class="error"></div></div><p class="tiny">اللعبة تدعم 2 أو 4 أو 6 لاعبين</p></section>

<section id="lobby" class="screen"><div class="topbar"><h2>غرفة اللعب</h2><span id="lround" class="round">بانتظار البداية</span></div><div id="code" class="code"></div><p class="tiny">أرسل الرمز لأصدقائك</p><div class="panel"><div id="lp" class="players"></div></div><button id="start" class="btn" onclick="start()">ابدأ الجولة</button><button class="alt" onclick="copyCode()">نسخ رمز الغرفة</button><button class="alt" onclick="resetGame()">خروج</button><div id="e2" class="error"></div></section>

<section id="game" class="screen"><div class="topbar"><span id="gstatus" class="round">جاري اللعب</span><span id="gplayers" class="round"></span></div><div class="target">كلمتك السرية</div><div id="target" class="word"></div><div id="timer" class="timer">45</div><div id="status" class="status"></div><div class="hand-title">يدك — اختر حرفًا لتمريره</div><div id="cards" class="cards"></div><div id="legend" class="legend"></div><button id="pass" class="btn" onclick="pass()" disabled>اختر حرفًا</button><div class="divider"></div><h3>اللاعبون</h3><div id="gp" class="players"></div></section>

<section id="finish" class="screen"><div class="finish-icon">🏆</div><div class="brand" style="font-size:34px">نهاية الجولة</div><div id="roundno" class="tiny"></div><div id="winner" class="panel winner"></div><div id="scores" class="players"></div><button id="next" class="btn" onclick="nextRound()">جولة جديدة</button><p id="wait" class="tiny"></p><button class="alt" onclick="resetGame()">العودة للرئيسية</button></section>
</div></main><script>
let room="",pid="",s=null,sel=null,timer=null;
const q=x=>document.getElementById(x),show=x=>{document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));q(x).classList.add("active")};
function er(m,id){q(id).textContent=m;q(id).style.display="block";setTimeout(()=>q(id).style.display="none",3200)}
async function post(u,b){let r=await fetch(u,{method:"POST",headers:{"content-type":"application/json","cache-control":"no-cache"},cache:"no-store",body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||"حدث خطأ");return j}
async function create(){try{let name=q("name").value.trim()||"لاعب";let j=await post("/api/create",{name});room=j.room;pid=j.player;save();show("lobby");loop()}catch(e){er(e.message,"e1")}}
async function join(){try{let name=q("name").value.trim()||"لاعب";let j=await post("/api/join",{room:q("join").value.trim().toUpperCase(),name});room=j.room;pid=j.player;save();show("lobby");loop()}catch(e){er(e.message,"e1")}}
async function start(){try{await post("/api/start",{room,player:pid})}catch(e){er(e.message,"e2")}}
async function nextRound(){try{await post("/api/next",{room,player:pid});sel=null}catch(e){er(e.message,"e2")}}
async function copyCode(){try{await navigator.clipboard.writeText(room);er("تم نسخ رمز الغرفة","e2")}catch(e){er("انسخ الرمز يدويًا: "+room,"e2")}}
function save(){localStorage.hf=JSON.stringify({room,pid})}
function esc(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function render(x){s=x;q("code").textContent=x.room;
if(x.phase==="lobby"){show("lobby");q("lround").textContent="الجولة "+(x.round+1);let enough=[2,4,6].includes(x.players.length);q("start").style.display=x.players[0].id===pid?"block":"none";q("start").disabled=!enough;q("start").textContent=enough?"ابدأ الجولة":"تحتاج "+([2,4,6].find(n=>n>=x.players.length)||"2")+" لاعبين";q("lp").innerHTML=x.players.map((p,i)=>'<div class="player '+(p.id===pid?"you":"")+'"><strong>'+esc(p.name)+(i===0?' <span class="badge">المضيف</span>':"")+'</strong><span class="score">جاهز</span></div>').join("");return}
if(x.phase==="finished"){show("finish");let w=x.players.find(p=>p.id===x.winner);q("roundno").textContent="الجولة "+x.round;q("winner").innerHTML=w?"الفائز: <strong>"+esc(w.name)+"</strong>":"انتهت الجولة";q("scores").innerHTML=x.players.slice().sort((a,b)=>b.score-a.score).map(p=>'<div class="player '+(p.id===pid?"you":"")+'"><strong>'+esc(p.name)+'</strong><span class="score">النقاط: '+p.score+'</span></div>').join("");let host=x.players[0].id===pid;q("next").style.display=host?"block":"none";q("wait").textContent=host?"أنت المضيف — ابدأ جولة جديدة بنفس اللاعبين.":"بانتظار المضيف لبدء الجولة التالية.";return}
show("game");q("gstatus").textContent="الجولة "+x.round;q("gplayers").textContent=x.players.length+" لاعبين";q("target").textContent=x.me.target;let hand=x.me.hand||[],pending=x.me.pending,full=pending?hand.concat([pending]):hand;q("cards").innerHTML=full.length?full.map((c,i)=>{let isPending=pending&&i===hand.length;return '<div class="letter '+(sel===i?"selected ":"")+(isPending?"pending":"")+' '+(isPending?"locked":"")+'" onclick="pick('+i+')">'+esc(c)+'</div>'}).join(""):'<div class="empty">لا توجد حروف</div>';let my=x.players[x.turn].id===pid;q("status").className="status"+(my?" myturn":"");q("status").textContent=my?(pending?"حرف وصل إليك — اختر حرفًا من يدك ومرّره.":"دورك — اختر حرفًا لتمريره."):"دور "+esc(x.players[x.turn].name)+" — انتظر دورك.";q("pass").disabled=!my||sel===null;q("pass").textContent=sel===null?"اختر حرفًا":"تمرير الحرف";q("legend").textContent=pending?"الحرف الذهبي هو الحرف المستلم — لا يمكن تمريره مباشرة.":"الحروف البيضاء هي حروف يدك.";q("gp").innerHTML=x.players.map(p=>'<div class="player '+(p.id===pid?"you":"")+'"><strong>'+esc(p.name)+(x.players[x.turn].id===p.id?' <span class="badge">دوره</span>':"")+'</strong><span class="score">'+p.handCount+' حروف • '+p.score+' نقاط</span></div>').join("")}
function pick(i){if(!s||s.phase!=="playing"||s.players[s.turn].id!==pid)return;let len=s.me.hand.length;if(s.me.pending&&i===len){er("هذا هو الحرف المستلم، لا يمكن تمريره مباشرة.","e2");return}sel=i;render(s)}
async function pass(){if(sel===null)return;try{await post("/api/pass",{room,player:pid,index:sel});sel=null}catch(e){er(e.message,"e2")}}
async function loop(){clearInterval(timer);timer=setInterval(async()=>{try{let r=await fetch("/api/state?room="+encodeURIComponent(room)+"&player="+encodeURIComponent(pid),{cache:"no-store"});if(r.ok){render(await r.json());return}if(r.status===404){resetGame();er("انتهت الغرفة القديمة. أنشئ غرفة جديدة.","e1")}}catch(e){}},650)}
function resetGame(){clearInterval(timer);room="";pid="";s=null;sel=null;localStorage.removeItem("hf");show("home")}
setInterval(()=>{if(s&&s.ends){let n=Math.max(0,Math.ceil((s.ends-Date.now())/1000));q("timer").textContent=n;q("timer").className="timer"+(n<=10?" hot":"")}},200);
try{let x=JSON.parse(localStorage.hf||"null");if(x&&x.room&&x.pid){room=x.room;pid=x.pid;show("lobby");loop()}}catch(e){localStorage.removeItem("hf")}
</script></body></html>
